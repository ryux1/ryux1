<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ryu — systems engineer</title>
  <desc id="desc">Editorial engineering panel reading Software should keep its promises, with an uncertain signal resolving into verified evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF8F1"/>
      <stop offset="1" stop-color="#F0EDE3"/>
    </linearGradient>
    <linearGradient id="signal" x1="760" y1="351" x2="1091" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E94300"/>
      <stop offset="1" stop-color="#5E7900"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#171719" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="17" stroke="#171719" stroke-opacity="0.16" stroke-width="2"/>
  <rect x="684" width="516" height="520" fill="url(#grid)"/>
  <path d="M684 0V520" stroke="#171719" stroke-opacity="0.14"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="54" width="10" height="10" fill="#E94300"/>
    <text x="84" y="64" fill="#C73700" font-size="14" font-weight="700" letter-spacing="3.4">RYU / SYSTEMS ENGINEERING</text>

    <text x="58" y="156" fill="#171719" font-size="66" font-weight="800" letter-spacing="-2.2">
      <tspan x="58" dy="0">SOFTWARE SHOULD</tspan>
      <tspan x="58" dy="74">KEEP ITS PROMISES.</tspan>
    </text>

    <text x="61" y="292" fill="#5C5B57" font-size="17" letter-spacing="0.4">
      <tspan x="61" dy="0">Runtime behavior · distributed infrastructure</tspan>
      <tspan x="61" dy="28">reliability · security · performance</tspan>
    </text>

    <g transform="translate(60 390)">
      <text x="0" y="0" fill="#85827A" font-size="11" font-weight="700" letter-spacing="2">01</text>
      <text x="0" y="25" fill="#242426" font-size="14" font-weight="700" letter-spacing="1.2">OBSERVE</text>
      <path d="M104 18H130" stroke="#E94300" stroke-width="2"/>
      <text x="150" y="0" fill="#85827A" font-size="11" font-weight="700" letter-spacing="2">02</text>
      <text x="150" y="25" fill="#242426" font-size="14" font-weight="700" letter-spacing="1.2">ISOLATE</text>
      <path d="M248 18H274" stroke="#E94300" stroke-width="2"/>
      <text x="294" y="0" fill="#85827A" font-size="11" font-weight="700" letter-spacing="2">03</text>
      <text x="294" y="25" fill="#242426" font-size="14" font-weight="700" letter-spacing="1.2">CONSTRAIN</text>
      <path d="M408 18H434" stroke="#E94300" stroke-width="2"/>
      <text x="454" y="0" fill="#85827A" font-size="11" font-weight="700" letter-spacing="2">04</text>
      <text x="454" y="25" fill="#242426" font-size="14" font-weight="700" letter-spacing="1.2">PROVE</text>
    </g>

    <text x="60" y="482" fill="#8A877F" font-size="11" font-weight="700" letter-spacing="2.6">OPEN SOURCE / FAILURE SEMANTICS / EVIDENCE</text>
  </g>

  <g transform="translate(728 48)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="14" fill="#88857E" font-size="11" font-weight="700" letter-spacing="2.4">SIGNAL / 004</text>
    <text x="0" y="54" fill="#171719" font-size="22" font-weight="700">From ambiguity to evidence.</text>

    <path d="M0 112H408M0 176H408M0 240H408M0 304H408" stroke="#171719" stroke-opacity="0.1"/>
    <path d="M36 302C78 302 83 189 132 189C178 189 178 257 222 257C270 257 277 128 330 128H408" stroke="#171719" stroke-opacity="0.12" stroke-width="11" stroke-linecap="round"/>
    <path d="M36 302C78 302 83 189 132 189C178 189 178 257 222 257C270 257 277 128 330 128H408" stroke="url(#signal)" stroke-width="4" stroke-linecap="round"/>

    <circle cx="36" cy="302" r="7" fill="#F4F1E8" stroke="#E94300" stroke-width="3"/>
    <circle cx="132" cy="189" r="7" fill="#F4F1E8" stroke="#E8672F" stroke-width="3"/>
    <circle cx="222" cy="257" r="7" fill="#F4F1E8" stroke="#C48000" stroke-width="3"/>
    <circle cx="330" cy="128" r="7" fill="#F4F1E8" stroke="#698500" stroke-width="3"/>
    <circle cx="408" cy="128" r="7" fill="#698500"/>

    <g fill="#716F69" font-size="11" font-weight="700" letter-spacing="1.7">
      <text x="18" y="330">SIGNAL</text>
      <text x="109" y="169">STATE</text>
      <text x="193" y="286">BOUNDARY</text>
      <text x="300" y="108">INVARIANT</text>
    </g>

    <rect x="0" y="350" width="408" height="56" rx="7" fill="#171719" fill-opacity="0.035" stroke="#171719" stroke-opacity="0.11"/>
    <circle cx="27" cy="378" r="5" fill="#698500"/>
    <text x="44" y="383" fill="#4D6500" font-size="12" font-weight="700" letter-spacing="1.7">CONDITION VERIFIED</text>
    <text x="326" y="383" fill="#88857E" font-size="11" font-weight="700" letter-spacing="1.4">04 / 04</text>
  </g>
</svg>
