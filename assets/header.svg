<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ryu — systems engineer</title>
  <desc id="desc">A dark technical banner with a network diagram and the words runtime, distributed systems, reliability, and security.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0A1728"/>
      <stop offset="1" stop-color="#07101C"/>
    </linearGradient>
    <linearGradient id="accent" x1="76" y1="67" x2="556" y2="262" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EE7F7"/>
      <stop offset="1" stop-color="#6B8CFF"/>
    </linearGradient>
    <linearGradient id="line" x1="742" y1="40" x2="1120" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EE7F7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6B8CFF" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#B9D7FF" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#background)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <path d="M0 283C213 219 348 332 595 258C795 198 920 250 1200 170V320H0V283Z" fill="#5EE7F7" fill-opacity="0.025"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" stroke="#93C5FD" stroke-opacity="0.14" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="76" y="78" fill="#88A4C5" font-size="15" font-weight="600" letter-spacing="4">SYSTEMS ENGINEER / OPEN SOURCE</text>
    <text x="70" y="196" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="118" font-weight="800" letter-spacing="-7">RYU</text>
    <rect x="77" y="221" width="430" height="2" rx="1" fill="url(#accent)"/>
    <text x="76" y="258" fill="#D8E9FF" font-size="15" letter-spacing="1.8">RUNTIME · DISTRIBUTED SYSTEMS · RELIABILITY · SECURITY</text>
  </g>

  <g stroke="url(#line)" stroke-width="1.5">
    <path d="M742 83L861 54L959 111L1082 69"/>
    <path d="M742 83L790 179L905 223L1033 185L1125 250"/>
    <path d="M861 54L905 223"/>
    <path d="M959 111L905 223"/>
    <path d="M959 111L1033 185"/>
    <path d="M1082 69L1033 185"/>
  </g>

  <g fill="#07111F" stroke="#79DFF4" stroke-width="2">
    <circle cx="742" cy="83" r="7"/>
    <circle cx="861" cy="54" r="7"/>
    <circle cx="959" cy="111" r="9" filter="url(#glow)"/>
    <circle cx="1082" cy="69" r="7"/>
    <circle cx="790" cy="179" r="7"/>
    <circle cx="905" cy="223" r="9" filter="url(#glow)"/>
    <circle cx="1033" cy="185" r="7"/>
    <circle cx="1125" cy="250" r="7"/>
  </g>

  <g fill="#8EAACB" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.2">
    <text x="716" y="61">INPUT</text>
    <text x="837" y="31">STATE</text>
    <text x="934" y="88">INVARIANT</text>
    <text x="1057" y="47">POLICY</text>
    <text x="758" y="205">TRACE</text>
    <text x="880" y="252">EVIDENCE</text>
    <text x="1008" y="213">DECISION</text>
    <text x="1095" y="278">PROOF</text>
  </g>

</svg>
